name: Validate Frontmatter

on:
  pull_request:
    paths:
      - '**/agents/*.md'
      - '**/skills/*/SKILL.md'
      - '**/commands/*.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh pr diff reads the pull request's changed files
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: cd .github/scripts && bun install yaml

      - name: Get changed frontmatter files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh pr diff "$PR_NUMBER" --name-only | grep -E '(agents/.*\.md|skills/.*/SKILL\.md|commands/.*\.md)$' || true)
          # Skip files deleted or renamed away in this PR: they no longer exist in the checkout.
          EXISTING=""
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              EXISTING="${EXISTING}${f}"$'\n'
            fi
          done <<< "$FILES"
          {
            echo "files<<EOF_CHANGED_FILES"
            printf '%s' "$EXISTING"
            echo "EOF_CHANGED_FILES"
          } >> "$GITHUB_OUTPUT"

      - name: Validate frontmatter
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          printf '%s\n' "$CHANGED_FILES" | grep -v '^$' | tr '\n' '\0' | xargs -0 bun .github/scripts/validate-frontmatter.ts
